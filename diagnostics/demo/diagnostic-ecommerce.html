<script>
(function () {
  'use strict';
  var STORE = 'horinum-acces';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('gate-form'), input = document.getElementById('code');
  var btn = document.getElementById('gate-btn'), msg = document.getElementById('gate-msg');
  function dec(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function enc(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function store(t) { try { sessionStorage.setItem(STORE, t); } catch (e) {} }
  function forget() { try { sessionStorage.removeItem(STORE); } catch (e) {} }
  function openWith(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(P.iv) }, k, dec(P.ct)); })
      .then(function (pt) { return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); })
      .then(function (html) { store(enc(raw)); document.open(); document.write(html); document.close(); });
  }
  function derive(code) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: dec(P.salt), iterations: P.iter }, base, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function ready() { document.body.classList.remove('is-busy'); input.focus(); }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    document.body.classList.remove('is-busy');
    msg.textContent = 'Ce navigateur ne permet pas d’ouvrir ce document. Utilisez une version récente de Chrome, Edge, Firefox ou Safari.';
    btn.disabled = true; input.disabled = true; return;
  }
  var m = location.hash.match(/(?:^#|&)acces=([A-Za-z0-9_-]+)/);
  if (m) history.replaceState(null, '', location.pathname + location.search);
  var token = m ? m[1] : null;
  if (!token) { try { token = sessionStorage.getItem(STORE); } catch (e) {} }
  if (token) {
    openWith(dec(token)).catch(function () {
      forget(); ready();
      msg.textContent = 'Ce lien d’accès n’est plus valide. Saisissez le code reçu.';
    });
  } else { ready(); }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) return;
    btn.disabled = true; msg.textContent = 'Vérification du code…';
    derive(code).then(openWith).catch(function () {
      btn.disabled = false; input.select();
      msg.textContent = 'Code incorrect. Vérifiez qu’il correspond à celui reçu avec le lien.';
    });
  });
})();
</script>
